name: ci

on:
  push:
    branches: ['**']
    paths-ignore: ['formal/**', 'paper/**', 'contrib/vscode/**']
  pull_request:
    paths-ignore: ['formal/**', 'paper/**', 'contrib/vscode/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install OCaml (stdlib-only ocamlopt) + g++
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox g++
      - name: make check (ci/check.sh — all gates)
        run: make check
      - name: C++ runtime (CMake + ctest — libmetis_rt, the six tools, the C ABI conformance gate)
        # runtime/CMakeLists.txt: metis_rt_conformance first (the goldens
        # through the C ABI), metis_run, sample_run, and all four smokes —
        # the evaluator/IR smokes on runtime/fixtures, committed with their
        # metispy commit + generator hash (metispy parity.yml diffs them)
        run: |
          cmake -S runtime -B runtime/build
          cmake --build runtime/build -j2
          ctest --test-dir runtime/build --output-on-failure
