name: formal (Lean)

on:
  push:
    paths: ['formal/**', '.github/workflows/formal.yml']
  pull_request:
    paths: ['formal/**', '.github/workflows/formal.yml']
  schedule:
    - cron: '17 4 * * 1'        # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Lean/mathlib builds are slow; this workflow never gates ci.yml
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
