name: formal (Lean)

on:
  push:
    paths: ['formal/**', '.github/workflows/formal.yml']
  pull_request:
    paths: ['formal/**', '.github/workflows/formal.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
