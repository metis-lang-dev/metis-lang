name: check (metisc + runtime + corpus)

on:
  push:
    paths-ignore: ['formal/**', 'paper/**']
  pull_request:
    paths-ignore: ['formal/**', 'paper/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install OCaml
        run: sudo apt-get update && sudo apt-get install -y ocaml-nox
      - name: make check
        run: make check
