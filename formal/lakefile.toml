name = "formal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Formal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
# weak.linter.mathlibStandardSet = true  # style linters are for mathlib contributions
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "Formal"
